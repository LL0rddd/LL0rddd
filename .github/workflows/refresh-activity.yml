name: Atualizar atividade do perfil

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/refresh-activity.yml'
      - 'scripts/**'

permissions:
  contents: read

concurrency:
  group: refresh-profile-activity
  cancel-in-progress: false

jobs:
  refresh:
    if: github.repository == 'LL0rddd/LL0rddd' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout da branch principal
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
      - name: Configurar Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Instalar dependências
        run: python -m pip install -r scripts/requirements.txt
      - name: Validar antes da coleta
        run: python -m unittest discover -s scripts -p test_profile.py
      - name: Coletar e renderizar somente agregados
        env:
          GH_TOKEN: ${{ secrets.PROFILE_METRICS_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo '::error::Cadastre o secret PROFILE_METRICS_TOKEN com acesso pessoal e aos repositórios privados.'
            exit 1
          fi
          python scripts/refresh_activity.py
      - name: Validar métricas e imagens atualizadas
        run: python -m unittest discover -s scripts -p test_profile.py
      - name: Publicar apenas os indicadores do perfil
        run: |
          git add -- README.md assets/activity.json assets/activity.svg assets/activity.gif \
            'assets/versioned/activity-*.svg' 'assets/versioned/activity-*.gif'
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'Indicadores sem alterações.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore: atualizar indicadores de atividade'
          git push origin HEAD:refs/heads/main
