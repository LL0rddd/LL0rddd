<title>Atividade agregada de Lucas Aguiar: públicos e privados</title>
<desc>Latest six calendar months including the current partial month through as_of (reference date in America/Sao_Paulo; GitHub date queries use UTC). Commits and PRs authored by LL0rddd across accessible public and private repositories, including other owners and organizations. Commits indexed by GitHub search on default branches and author date, not all local or unmerged commits; PRs created in the period, in any state. Repository counter remains currently owned non-fork repositories created by each period end, excluding collaborators' repositories. Coverage depends on credential access and GitHub indexing. Not a reconstruction of past visibility, deletions or transfers. Independent zero-based scales. No private names, code, messages or URLs are exported.</desc>
