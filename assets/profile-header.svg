<svg width="1200" height="280" viewBox="0 0 1200 280" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Lucas Aguiar — Build, Test, Automate</title>
  <desc id="desc">Banner em azul profundo com detalhes em ciano e violeta, apresentando Lucas Aguiar e suas áreas de qualidade de software, integrações de APIs e ferramentas para desenvolvedores.</desc>

  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1200" y2="280" gradientUnits="userSpaceOnUse">
      <stop stop-color="#07111F"/>
      <stop offset="0.55" stop-color="#0B1830"/>
      <stop offset="1" stop-color="#15102A"/>
    </linearGradient>
    <linearGradient id="accent" x1="70" y1="0" x2="1070" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#22D3EE"/>
      <stop offset="0.52" stop-color="#38BDF8"/>
      <stop offset="1" stop-color="#A78BFA"/>
    </linearGradient>
    <radialGradient id="cyanGlow" cx="0" cy="0" r="1" gradientTransform="translate(1030 50) rotate(135) scale(330 250)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#22D3EE" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="violetGlow" cx="0" cy="0" r="1" gradientTransform="translate(1110 250) rotate(-140) scale(300 220)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#8B5CF6" stop-opacity="0.24"/>
      <stop offset="1" stop-color="#8B5CF6" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" stroke="#94A3B8" stroke-opacity="0.08"/>
    </pattern>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
  </defs>

  <rect x="1" y="1" width="1198" height="278" rx="22" fill="url(#background)" stroke="#233653" stroke-width="2"/>
  <rect x="1" y="1" width="1198" height="278" rx="22" fill="url(#grid)"/>
  <rect x="1" y="1" width="1198" height="278" rx="22" fill="url(#cyanGlow)"/>
  <rect x="1" y="1" width="1198" height="278" rx="22" fill="url(#violetGlow)"/>

  <g opacity="0.55">
    <path d="M876 61H948L980 93H1060" stroke="url(#accent)" stroke-width="2"/>
    <path d="M850 218H928L954 192H1080" stroke="url(#accent)" stroke-width="2"/>
    <circle cx="876" cy="61" r="4" fill="#22D3EE"/>
    <circle cx="1060" cy="93" r="4" fill="#A78BFA"/>
    <circle cx="850" cy="218" r="4" fill="#38BDF8"/>
    <circle cx="1080" cy="192" r="4" fill="#A78BFA"/>
  </g>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
    <rect x="68" y="43" width="286" height="34" rx="17" fill="#0E2037" stroke="#22D3EE" stroke-opacity="0.42"/>
    <circle cx="89" cy="60" r="5" fill="#22D3EE"/>
    <circle cx="89" cy="60" r="11" fill="#22D3EE" fill-opacity="0.24" filter="url(#softGlow)"/>
    <text x="105" y="65" fill="#A5F3FC" font-size="14" font-weight="700" letter-spacing="2.6">BUILD · TEST · AUTOMATE</text>

    <text x="68" y="143" fill="#F8FAFC" font-size="52" font-weight="720" letter-spacing="-1.2">Lucas Aguiar</text>
    <text x="71" y="183" fill="#CBD5E1" font-size="21" font-weight="450">Qualidade de software · Integrações de APIs · Ferramentas para devs</text>

    <rect x="70" y="218" width="390" height="4" rx="2" fill="url(#accent)"/>
    <text x="70" y="249" fill="#7DD3FC" font-size="13" font-weight="650" letter-spacing="1.6">EVIDÊNCIA  •  AUTOMAÇÃO  •  SEGURANÇA</text>

    <g transform="translate(1018 140)">
      <path d="M0 -64L55 -32V32L0 64L-55 32V-32L0 -64Z" fill="#0B172B" stroke="url(#accent)" stroke-width="3"/>
      <path d="M0 -48L41 -24V24L0 48L-41 24V-24L0 -48Z" stroke="#7DD3FC" stroke-opacity="0.28"/>
      <text x="0" y="13" text-anchor="middle" fill="#F8FAFC" font-size="38" font-weight="760" letter-spacing="1">LA</text>
    </g>
  </g>
</svg>
